post:
  operationId: rebootNode
  tags:
  - Nodes
  summary: Reboot the node
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - $ref: ../../components/parameters/nodeName.yaml
  responses:
    '202':
      description: the reboot request received, the node is rebooting
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 202
              msg:
                type: string
                example: node reboot request received, the node is rebooting
              status:
                type: string
                example: accepted
    '404':
      description: Node not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
              msg:
                type: string
                example: node not found
              status:
                type: string
                example: not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to reboot the node: internal server error'
              status:
                type: string
                example: internal server error
