get:
  operationId: listIntegrationStorages
  tags:
  - Integrations
  summary: Retrieve the list of integrated storages
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  responses:
    '200':
      description: Retrieve the list of integrated storages successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ListIntegrationStoragesResponse.yaml
          examples:
            example1:
              summary: Integrated storages
              value:
                code: 200
                data:
                - name: CubeStorage
                  type: built-in
                  vendor: CubeCOS
                  managementIp: 10.32.45.1
                  updatedAt: '2025-07-31T16:33:06+08:00'
                  isDefault: true
                  isVerified: true
                  status:
                    current: ok
                    isProcessing: false
                msg: fetch integrated storages successfully
                status: ok
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to fetch integrated applications: internal server
                  error'
              status:
                type: string
                example: internal server error
post:
  operationId: createIntegrationStorage
  tags:
  - Integrations
  summary: Integrate a storage
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ApplyIntegrationStorageRequest.yaml
        examples:
          example1:
            summary: Create integration storage request
            value:
              name: dell-emc-sc-fc
              driver: cinder.volume.drivers.dell_emc.sc.storagecenter_fc.SCFCDriver
              storage:
                service:
                  driverSection:
                  - key: san_ip
                    value: 10.32.10.250
                  - key: san_login
                    value: Admin
                  - key: san_password
                    value: bigstackcoltd
                  - key: san_thin_provision
                    value: 'true'
                  - key: dell_sc_ssn
                    value: '364940'
                  - key: dell_sc_api_port
                    value: '3033'
                  - key: dell_sc_verify_cert
                    value: 'false'
                  - key: dell_sc_server_folder
                    value: dev-servers/glance-cluster
                  - key: dell_sc_volume_folder
                    value: dev-vols
                  - key: use_multipath_for_image_xfer
                    value: 'true'
                  - key: enforce_multipath_for_image_xfer
                    value: 'true'
                  - key: image_upload_use_cinder_backend
                    value: 'true'
                  extraSettings:
                  - sectionHeader: DEFAULT
                    settings:
                    - key: allowed_direct_url_schemes
                      value: cinder
                    - key: glance_request_timeout
                      value: '1200'
                  extraConfigFiles:
                  - name: test.conf
                    content: YWFhCg==
                volumeType:
                  settings:
                  - key: storagetype:storageprofile
                    value: ''
                  - key: replication_enabled
                    value: ''
                  - key: replication_type
                    value: ''
                  - key: replication:activereplay
                    value: ''
                  - key: replication:livevolume
                    value: ''
                  - key: storagetype:volumeqos
                    value: ''
                  - key: storagetype:groupqos
                    value: ''
                  - key: storagetype:datareductionprofile
                    value: ''
                  - key: multiattach
                    value: ''
                image:
                  useMultipath: true
                  forceMultipath: true
  responses:
    '202':
      description: Receive the request to integrate a storage successfully, processing
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 202
              msg:
                type: string
                example: receive the request to integrate a storage successfully,
                  processing
              status:
                type: string
                example: accepted
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 409
              msg:
                type: string
                example: storage name example-storage already exists
              status:
                type: string
                example: conflict
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to create integration storage: internal server error'
              status:
                type: string
                example: internal server error
