delete:
  operationId: deleteIntegrationStorageModel
  tags:
  - Integrations
  summary: Delete an integration storage model
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - $ref: ../../components/parameters/driverName.yaml
  responses:
    '202':
      description: Receive the request to delete an integration storage model successfully,
        processing
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 202
              msg:
                type: string
                example: receive the request to delete an integration storage model
                  successfully, processing
              status:
                type: string
                example: accepted
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 404
              msg:
                type: string
                example: storage model Dell PowerVault not found
              status:
                type: string
                example: not found
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 409
              msg:
                type: string
                example: storage model Dell PowerVault is in use by some integrated
                  storages
              status:
                type: string
                example: conflict
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to delete integration storage model: internal server
                  error'
              status:
                type: string
                example: internal server error
patch:
  operationId: updateIntegrationStorageModel
  tags:
  - Integrations
  summary: Create an integration storage model
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - $ref: ../../components/parameters/driverName.yaml
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../../components/schemas/ApplyIntegreationStorageModelsRequest.yaml
  responses:
    '202':
      description: Receive the request to update an integration storage model successfully,
        processing
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 202
              msg:
                type: string
                example: receive the request to update an integration storage model
                  successfully, processing
              status:
                type: string
                example: accepted
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 400
              msg:
                type: string
                example: vendor and product are required fields
              status:
                type: string
                example: bad request
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 404
              msg:
                type: string
                example: storage model Dell PowerVault not found
              status:
                type: string
                example: not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to create integration storage model: internal server
                  error'
              status:
                type: string
                example: internal server error
