get:
  operationId: getServiceHealthHistory
  tags:
  - Health
  summary: Retrieve the all modules health status from a service
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - in: path
    name: serviceType
    required: true
    schema:
      type: string
      enum:
      - clusterLink
      - clusterSys
      - clusterSettings
      - haCluster
      - msgQueue
      - iaasDb
      - virtualIp
      - storage
      - apiService
      - singleSignOn
      - network
      - compute
      - bareMetal
      - image
      - blockStor
      - fileStor
      - objectStor
      - orchestration
      - lbaas
      - dnsaas
      - k8saas
      - instanceHa
      - businessLogic
      - dataPipe
      - metrics
      - logAnalytics
      - notifications
    description: The name of the service to retrieve health history. use GET /api/v1/datacenters/{dataCenter}/services
      to get the service list and their modules.
  - $ref: ../../components/parameters/watch.yaml
  - $ref: ../../components/parameters/start.yaml
  - $ref: ../../components/parameters/stop.yaml
  - in: query
    name: past
    required: false
    schema:
      type: string
      enum:
      - 1h
      - 24h
      - 7d
      - 14d
      - 30d
    description: The past time of the health history to query, click 'try it out'
      to see a few options, but can specify with the 's'(second), 'm'(minute), 'h'(hour),
      and 'd'(day) suffix for other time ranges.
    example: 1d
  responses:
    '200':
      description: Retrieve the health history of service successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/GetServiceHealthHistoryResponse.yaml
          examples:
