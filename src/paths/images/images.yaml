  - $ref: ../../components/parameters/watch.yaml
  - $ref: ../../components/parameters/projectNotRequired.yaml
  - in: query
    name: visibility
    required: false
    schema:
      type: string
    description: The visibility to filter
    example: public
  - $ref: ../../components/parameters/pageSize.yaml
  - $ref: ../../components/parameters/pageNum.yaml
  - $ref: ../../components/parameters/keyword.yaml
  responses:
    '200':
      description: List images successfully
      content:
