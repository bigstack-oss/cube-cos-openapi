get:
  operationId: getAbstractedEvents
  tags:
  - Events
  summary: Retrieve the abstracted events
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - in: query
    name: type
    required: true
    schema:
      type: string
      enum:
      - system
      - host
      - instance
    description: The type of event to query, the value can be only 'system', 'host',
      and 'instance'.
    example: system
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    description: The limit of the abstracted events to return (default is 10).
    example: 10
  - $ref: ../../components/parameters/watch.yaml
  responses:
