get:
  operationId: getEvents
  tags:
  - Events
  summary: Retrieve the list of events
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - in: query
    name: type
    required: true
    schema:
      type: string
      enum:
      - system
      - host
      - instance
    description: The type of event to query, the value can be only 'system', 'host',
      and 'instance'.
    example: system
  - in: query
    name: keyword
    required: false
    schema:
      type: string
    description: The keyword of the event to query.
    example: 10.10.10.10 is reachable
  - in: query
    name: id
    required: false
    schema:
      type: string
    description: The id of the event to query.
    example: NET00003I
  - in: query
    name: categories
    required: false
    schema:
      type: array
      items:
        type: string
    description: The category of the event to query.
    example: NET
  - in: query
    name: severities
    required: false
    schema:
      type: array
      items:
        type: string
        enum:
        - Info
        - Warning
        - Error
    description: The severity of the event to query, the value can be only 'Info',
      'Warning', and 'Error'.
    example: Info
  - in: query
    name: hosts
    required: false
    schema:
      type: array
      items:
        type: string
    description: The host of the event to query.
    example: example-node-0
  - in: query
    name: instances
    required: false
    schema:
      type: array
      items:
        type: string
    description: The instance of the event to query.
    example: ccc449e4-a26c-47ac-afc1-c792ab1ed20a
  - in: query
    name: past
    required: false
    schema:
      type: string
    description: The past time of the event to query, use the unit of 's'(second),
      'm'(minute), 'h'(hour), and 'd'(day) suffix to specify the time range.
    example: 1d
  - $ref: ../../components/parameters/start.yaml
  - $ref: ../../components/parameters/stop.yaml
  - $ref: ../../components/parameters/pageSize.yaml
  - $ref: ../../components/parameters/pageNum.yaml
  - $ref: ../../components/parameters/watch.yaml
  responses:
    '200':
      description: Retrieve the list of events successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/GetEventsResponse.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              msg:
                type: string
                example: 'invalid ''start'' time: 2021-09-01T111:00:00+00:00'
              status:
                type: string
                example: bad request
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to fetch events: internal server error'
              status:
                type: string
                example: internal server error
