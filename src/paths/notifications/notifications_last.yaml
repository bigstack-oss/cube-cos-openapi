get:
  operationId: getLastNotification
  tags:
  - Notifications
  summary: Retrieve the last notification
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  responses:
    '200':
      description: Retrieve the last notification successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/GetNotificationResponse.yaml
          examples:
            example1:
              summary: Last notification
              value:
                code: 200
                data:
                  id: OSD00002E
                  nodeName: example-node-1
                  time: '2025-07-21T04:09:30+08:00'
                  additionalInfo:
                    osdId: osd.1
                    reweight: 0.75
                msg: fetch the last notification successfully
                status: ok
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to fetch the last notification: internal server error'
              status:
                type: string
                example: internal server error
