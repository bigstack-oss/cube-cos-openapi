post:
  operationId: rollbackFixpack
  tags:
  - Fixpacks
  summary: Rollback a fixpack
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - $ref: ../../components/parameters/version.yaml
  responses:
    '202':
      description: Fixpack rollback started successfully
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 202
              msg:
                type: string
                example: Fixpack rollback started successfully
              status:
                type: string
                example: ok
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 400
              msg:
                type: string
                example: fixpack version FIX_001 is not rollbackable
              status:
                type: string
                example: bad request
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 404
              msg:
                type: string
                example: '''FIX_001'' not found'
              status:
                type: string
                example: not found
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 409
              msg:
                type: string
                example: a fixpack operation is already in progress
              status:
                type: string
                example: conflict
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to start fixpack rollback: internal server error'
              status:
                type: string
                example: internal server error
