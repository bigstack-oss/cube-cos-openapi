get:
  operationId: listFixpackUpdatableNodes
  tags:
  - Fixpacks
  summary: Get nodes that can be updated with the specified fixpack
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  - $ref: ../../components/parameters/version.yaml
  responses:
    '200':
      description: List of nodes that can be updated with the specified fixpack
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ListFixpackUpdatableNodesResponse.yaml
          examples:
            example:
              summary: Updatable nodes
              value:
                code: 200
                data:
                - name: cube451
                  version: Cube Appliance 3.1.0
                  updatedAt: '2025-08-08T19:51:40+08:00'
                - name: cube452
                  version: Cube Appliance 3.1.0
                  updatedAt: '2025-08-08T19:51:40+08:00'
                - name: cube453
                  version: Cube Appliance 3.1.0
                  updatedAt: '2025-08-08T19:51:40+08:00'
                msg: Fetched updatable nodes successfully
                status: ok
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 404
              msg:
                type: string
                example: '''FIX_001'' not found'
              status:
                type: string
                example: not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - msg
            - status
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to list updatable nodes: internal server error'
              status:
                type: string
                example: internal server error
