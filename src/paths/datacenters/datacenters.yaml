get:
  operationId: getDataCenters
  description: Retrieve the list of data centers
  tags:
  - Data Centers
  summary: Retrieve the list of data centers
  responses:
    '200':
      description: Retrieve the list of data centers successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/GetDataCentersResponse.yaml
          examples:
            example:
              summary: Data centers
              value:
                code: 200
                data:
                - type: cloud
                  name: example-data-center
                  roles:
                  - control-converged
                  - control
                  - compute
                  - storage
                  version: Cube Appliance 3.0.0
                  virtualIp: 10.10.10.10
                  isLocal: true
                  isHaEnabled: false
                  utcTimeZone: +00:00
                  firmware:
                    version: Cube Appliance 3.1.0
                    updatedAt: '2025-08-08T19:51:40+08:00'
                  fixpack:
                    name: Cube 3.0.0
                    version: Fixpack 1
                    updatedAt: '2025-08-10T19:51:40+08:00'
                  additional:
                    helpUrl: https://www.bigstack.co/contact-us
                    v1ApiDocUrl: https://example-virtual-ip/api/v1/datacenters/example-datacenter/apidocs/index.html
                    nodeLicenseStatus:
                      valid: 3
                      expired: 0
                      unlicense: 0
                msg: fetch data center list successfully
                status: ok
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to fetch data centers: internal server error'
              status:
                type: string
                example: internal server error
