get:
  operationId: getMe
  tags:
  - User Info
  summary: Retrieve the own user info
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  responses:
    '200':
      description: Retrieve the own user info successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/GetMeResponse.yaml
          examples:
            example1:
              summary: Own user info
              value:
                code: 200
                data:
                  name: admin
                msg: fetch own user info successfully
                status: ok
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to fetch own user info: internal server error'
              status:
                type: string
                example: internal server error
