post:
  operationId: createSupportFiles
  tags:
  - Support Files
  summary: Create one or more support files
  parameters:
  - $ref: ../../components/parameters/dataCenter.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CreateSupportFilesRequest.yaml
        examples:
          example:
            summary: Support file creation request
            value:
              description: example-description
              hosts:
              - example-node-0
  responses:
    '202':
      description: Support file creation request received
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/CreateSupportFilesResponse.yaml
          examples:
            example:
              summary: Support file creation response
              value:
                code: 202
                msg: support file creation request received
                status: ok
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              msg:
                type: string
                example: invalid host found
              status:
                type: string
                example: bad request
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 401
              msg:
                type: string
                example: 'invalid_grant: Invalid user credentials'
              status:
                type: string
                example: unauthorized
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              msg:
                type: string
                example: 'failed to request support file creation: internal server
                  error'
              status:
                type: string
                example: internal server error
