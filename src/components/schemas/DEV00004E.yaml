type: object
required:
- id
- nodeName
- time
- additionalInfo
properties:
  id:
    type: string
    pattern: ^DEV
  nodeName:
    type: string
  time:
    type: string
    format: date-time
  additionalInfo:
    type: object
    required:
    - device
    properties:
      device:
        type: string
      description:
        type: string
