type: object
required:
- code
- data
- msg
- status
properties:
  code:
    type: integer
    example: 200
  data:
    type: object
    required:
    - dataCenter
    - host
    - vm
    properties:
      dataCenter:
        type: object
        required:
        - usage
        properties:
          usage:
            type: object
            required:
            - cpu
            - memory
            properties:
              cpu:
                type: object
                required:
                - totalCores
                - usedCores
                - usedPercent
                - freeCores
                - freePercent
                properties:
                  totalCores:
                    type: integer
                    example: 80
                  usedCores:
                    type: integer
                    example: 31
                  usedPercent:
                    type: number
                    example: 38.75
                  freeCores:
                    type: integer
                    example: 49
                  freePercent:
                    type: number
                    example: 61.25
              memory:
                type: object
                required:
                - totalMiB
                - usedMiB
                - usedPercent
                - freeMiB
                - freePercent
                properties:
                  totalMiB:
                    type: integer
                    example: 257371
                  usedMiB:
                    type: integer
                    example: 98255
                  usedPercent:
                    type: number
                    example: 38.2
                  freeMiB:
                    type: integer
                    example: 159116
                  freePercent:
                    type: number
                    example: 61.8
      host:
        type: object
        required:
        - role
        - usages
        properties:
          role:
            type: object
            required:
            - controlConverged
            - control
            - compute
            - storage
            - edgeCore
            - moderator
            properties:
              controlConverged:
                $ref: ./RoleUsage.yaml
              control:
                $ref: ./RoleUsage.yaml
              compute:
                $ref: ./RoleUsage.yaml
              storage:
                $ref: ./RoleUsage.yaml
              edgeCore:
                $ref: ./RoleUsage.yaml
              moderator:
                $ref: ./RoleUsage.yaml
          usages:
            type: array
            items:
              type: object
              required:
              - role
              - name
              - address
              - cpu
              - memory
              properties:
                role:
                  type: string
                name:
                  type: string
                address:
                  type: string
                cpu:
                  type: object
                  required:
                  - totalCores
                  - usedCores
                  - usedPercent
                  - freeCores
                  - freePercent
                  properties:
                    totalCores:
                      type: integer
                    usedCores:
                      type: integer
                    usedPercent:
                      type: number
                    freeCores:
                      type: integer
                    freePercent:
                      type: number
                memory:
                  type: object
                  required:
                  - totalMiB
                  - usedMiB
                  - usedPercent
                  - freeMiB
                  - freePercent
                  properties:
                    totalMiB:
                      type: integer
                    usedMiB:
                      type: integer
                    usedPercent:
                      type: number
                    freeMiB:
                      type: integer
                    freePercent:
                      type: number
      vm:
        type: object
        required:
        - status
        - usage
        properties:
          status:
            type: object
            required:
            - total
            - running
            - stopped
            - paused
            - suspend
            - error
            properties:
              total:
                type: integer
                example: 10
              running:
                type: integer
                example: 8
              stopped:
                type: integer
                example: 2
              paused:
                type: integer
                example: 0
              suspend:
                type: integer
                example: 0
              error:
                type: integer
                example: 0
          usage:
            type: object
            required:
            - vcpu
            - memory
            - storage
            properties:
              vcpu:
                type: object
                required:
                - totalCores
                - usedCores
                - freeCores
                - usedPercent
                - freePercent
                properties:
                  totalCores:
                    type: integer
                    example: 80
                  usedCores:
                    type: integer
                    example: 31
                  freeCores:
                    type: integer
                    example: 49
                  usedPercent:
                    type: number
                    example: 38.75
                  freePercent:
                    type: number
                    example: 61.25
              memory:
                type: object
                required:
                - totalMiB
                - usedMiB
                - freeMiB
                - usedPercent
                - freePercent
                properties:
                  totalMiB:
                    type: integer
                    example: 257371
                  usedMiB:
                    type: integer
                    example: 98255
                  freeMiB:
                    type: integer
                    example: 159116
                  usedPercent:
                    type: number
                    example: 38.2
                  freePercent:
                    type: number
                    example: 61.8
              storage:
                type: object
                required:
                - totalMiB
                - usedMiB
                - freeMiB
                - usedPercent
                - freePercent
                properties:
                  totalMiB:
                    type: integer
                    example: 102400
                  usedMiB:
                    type: integer
                    example: 51200
                  freeMiB:
                    type: integer
                    example: 51200
                  usedPercent:
                    type: number
                    example: 50.1
                  freePercent:
                    type: number
                    example: 50.1
  msg:
    type: string
    example: fetch summary successfully
  status:
    type: string
    example: ok
