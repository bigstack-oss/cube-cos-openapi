type: object
required:
- id
- nodeName
- time
- additionalInfo
properties:
  id:
    type: string
    pattern: ^OSD
  nodeName:
    type: string
  time:
    type: string
    format: date-time
  additionalInfo:
    type: object
    required:
    - osdId
    properties:
      osdId:
        type: string
      description:
        type: string
