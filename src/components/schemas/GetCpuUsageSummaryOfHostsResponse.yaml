  data:
    type: object
    required:
    - totalCores
    - usedCores
    - usedPercent
    - freeCores
    - freePercent
    properties:
      totalCores:
        type: integer
      usedCores:
        type: integer
      usedPercent:
        type: number
      freeCores:
        type: integer
      freePercent:
        type: number
  msg:
    type: string
    example: fetch metrics successfully
  status:
    type: string
    example: ok
