type: object
required:
- vendor
- product
- multipath
- storage
properties:
  vendor:
    type: string
  product:
    type: string
  multipath:
    type: object
    required:
    - defaults
    - blacklist
    - blacklistExceptions
    - devices
    - overrides
    - multipaths
    properties:
      defaults:
        type: array
        items:
          $ref: ./StorageKeyValuePair.yaml
      blacklist:
        type: object
        required:
        - devnode
        - devices
        properties:
          devnode:
            type: string
          devices:
            type: array
            items:
              $ref: ./StorageModelVenderSetting.yaml
      blacklistExceptions:
        type: object
        required:
        - devnode
        - devices
        properties:
          devnode:
            type: string
          devices:
            type: array
            items:
              $ref: ./StorageModelVenderSetting.yaml
      devices:
        type: array
        items:
          $ref: ./StorageModelVenderSetting.yaml
      overrides:
        type: array
        items:
          $ref: ./StorageKeyValuePair.yaml
      multipaths:
        type: array
        items:
          type: object
          required:
          - wwid
          - settings
          properties:
            wwid:
              type: string
            settings:
              type: array
              items:
                $ref: ./StorageKeyValuePair.yaml
  storage:
    type: object
    required:
    - service
    - volumeType
    - image
    - updateTime
    properties:
      service:
        type: object
        required:
        - driverSection
        - extraSettings
        - extraConfigFiles
        properties:
          driverSection:
            type: array
            items:
              $ref: ./StorageKeyValuePair.yaml
          extraSettings:
            type: array
            items:
              type: object
              required:
              - sectionHeader
              - settings
              properties:
                sectionHeader:
                  type: string
                settings:
                  type: array
                  items:
                    $ref: ./StorageKeyValuePair.yaml
          extraConfigFiles:
            type: array
            items:
              type: object
              required:
              - name
              - content
              properties:
                name:
                  type: string
                content:
                  type: string
                  description: Base64 encoded content of the config file
      volumeType:
        type: object
        required:
        - settings
        properties:
          settings:
            type: array
            items:
              $ref: ./StorageKeyValuePair.yaml
      image:
        type: object
        required:
        - useMultipath
        - forceMultipath
        properties:
          useMultipath:
            type: boolean
          forceMultipath:
            type: boolean
      updateTime:
        type: string
        format: date-time
