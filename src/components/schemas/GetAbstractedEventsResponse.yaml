type: object
required:
- code
- data
- msg
- status
properties:
  code:
    type: integer
  data:
    type: object
    required:
    - events
    - limit
    properties:
      events:
        type: array
        items:
          type: object
          required:
          - type
          - severity
          - id
          - description
          - host
          - category
          - service
          - metadata
          - time
          properties:
            type:
              type: string
            severity:
              type: string
            id:
              type: string
            description:
              type: string
            host:
              type: string
            category:
              type: string
            service:
              type: string
            metadata:
              type: object
              properties:
                id:
                  type: string
                ip:
                  type: string
            time:
              type: string
      limit:
        type: object
        required:
        - number
        - description
        properties:
          number:
            type: integer
          description:
            type: string
  msg:
    type: string
  status:
    type: string
