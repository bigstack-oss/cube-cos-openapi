type: object
required:
- code
- data
- msg
- status
properties:
  code:
    type: integer
  data:
    type: object
    required:
    - events
    - limit
    properties:
      events:
        type: array
        items:
          type: object
          required:
          - id
          - percent
          - number
          properties:
            id:
              type: string
            severity:
              type: string
            category:
              type: string
            host:
              type: string
            instanceId:
              type: string
            instanceName:
              type: string
            percent:
              type: number
            number:
              type: integer
      limit:
        type: object
        required:
        - number
        - description
        properties:
          number:
            type: integer
          description:
            type: string
  msg:
    type: string
  status:
    type: string
