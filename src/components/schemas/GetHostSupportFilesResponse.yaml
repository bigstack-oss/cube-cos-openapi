type: object
required:
- code
- data
- msg
- status
properties:
  code:
    type: integer
    example: 200
  data:
    type: array
    items:
      type: object
      required:
      - name
      - group
      - description
      - source
      - sizeMiB
      - url
      - status
      properties:
        name:
          type: string
        group:
          type: string
        description:
          type: string
        source:
          type: object
          required:
          - role
          - host
          properties:
            role:
              type: string
            host:
              type: string
        sizeMiB:
          type: integer
        url:
          type: string
        status:
          type: object
          required:
          - current
          - isCreating
          - createdAt
          properties:
            current:
              type: string
              enum:
              - ok
              - error
            isCreating:
              type: boolean
            createdAt:
              type: string
  msg:
    type: string
  status:
    type: string
