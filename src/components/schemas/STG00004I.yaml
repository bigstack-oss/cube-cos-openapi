type: object
required:
- id
- nodeName
- time
- additionalInfo
properties:
  id:
    type: string
    pattern: ^STG
  nodeName:
    type: string
  time:
    type: string
    format: date-time
  additionalInfo:
    type: object
    required:
    - name
    - isCinderServiceUp
    - isTestVolumeSuccessful
    properties:
      name:
        type: string
      isCinderServiceUp:
        type: boolean
      isTestVolumeSuccessful:
        type: boolean
