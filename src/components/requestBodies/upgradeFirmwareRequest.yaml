description: Request body for upgrading firmware
required: true
content:
  application/json:
    schema:
      type: object
      required:
      - version
      - autoRolling
      properties:
        version:
          type: string
          description: The version of the firmware to be upgraded to
        autoRolling:
          type: boolean
          description: Whether to automatically roll the upgrade across all nodes
    example:
      version: CUBE 3.1.0
      autoRolling: true
